<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellApp</title>
    <link rel="shortcut icon" href="img/Favicon/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="db.js" defer></script>
</head>

<body onload="renderMenu()">
    <header>
        <img class="logoImg" src="img/Logo/Logo.png" alt="Logo">
    </header>
    <main>
        <section class="content">
            <img class="foodImg" src="img/indianFood.jpeg" alt="">
            <img class="lotusImg" src="img/lotus-6474572_1280.jpg" alt="">
            <div class="foodContent">
                <h1>Badshah Restaurant</h1>
                <p class="rating">Bewertung (4,8 von 5 Sternen)</p>
                <h3 class="mainDishesHeadline">Hauptgerichte</h3>
                <div id="menus"></div>
                <div class="contentBtnContainer">
                    <button class="orderButtonContent">Warenkorb</button>
                </div>
            </div>
        </section>
        <section class="basketWrapper" id="basketWrapper">
            <div class="basket">
                <h2 class="basketHeadline">Warenkorb</h2>
                <div id="orderedFood">
                    
                </div>
                <div class="sumUpResult">
                    <p>Gemsamtpreis:</p>
                    <p id="totalResult"></p>
                </div>
                <div class="orderBtnContainer">
                    <button class="orderButtonBasket" onclick="toogleBasket()">Bestellen</button>
                </div>
            </div>
        </section>
    </main>
    <footer>
        <p>Created By Sohrab Arenja</p>
    </footer>
</body>
</html>
